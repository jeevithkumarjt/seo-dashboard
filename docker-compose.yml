services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: seo_monitor
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo_password
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seo:seo_password@postgres:5432/seo_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  worker:
    build: ./apps/worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://seo:seo_password@postgres:5432/seo_monitor
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres-data:
